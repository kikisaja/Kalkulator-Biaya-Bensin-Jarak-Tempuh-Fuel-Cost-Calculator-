<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Biaya Bensin ⛽</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-card">
        <!-- Header -->
        <header class="app-header">
            <span class="badge">Fuel-Cost-Calculator</span>
            <h1>⛽ TRIP FUEL CALCULATOR</h1>
            <p>Hitung estimasi bensin & patungan roadtrip kamu!</p>
        </header>

        <!-- Form Input -->
        <form id="fuel-form" class="calculator-form">
            
            <!-- Jarak Tempuh -->
            <div class="input-group">
                <label for="distance">📍 Jarak Tempuh (km)</label>
                <input type="number" id="distance" placeholder="Contoh: 120" min="1" required>
            </div>

            <!-- Konsumsi BBM -->
            <div class="input-group">
                <label for="consumption">🚗 Konsumsi BBM (km / Liter)</label>
                <input type="number" id="consumption" placeholder="Contoh: 12" min="1" step="0.1" required>
            </div>

            <!-- Pilihan Preset Harga BBM -->
            <div class="input-group">
                <label>⛽ Jenis Bahan Bakar</label>
                <div class="fuel-presets">
                    <button type="button" class="preset-btn active" data-price="10000">Pertalite<br><small>10.000/L</small></button>
                    <button type="button" class="preset-btn" data-price="12950">Pertamax<br><small>12.950/L</small></button>
                    <button type="button" class="preset-btn" data-price="6800">Solar<br><small>6.800/L</small></button>
                </div>
            </div>

            <!-- Input Harga BBM Manual -->
            <div class="input-group">
                <label for="fuel-price">💵 Harga Bensin per Liter (Rp)</label>
                <input type="number" id="fuel-price" value="10000" min="1" required>
            </div>

            <!-- Jumlah Penumpang (Patungan) -->
            <div class="input-group">
                <label for="passengers">👥 Jumlah Orang (Patungan)</label>
                <input type="number" id="passengers" value="1" min="1" required>
            </div>

            <button type="submit" class="btn-calculate">🚀 HITUNG BIAYA</button>
        </form>

        <!-- Result Box -->
        <div class="result-card hidden" id="result-card">
            <h2>Hasil Estimasi Biaya</h2>

            <div class="main-stat">
                <span class="stat-label">Total Biaya Bensin</span>
                <span class="stat-value" id="total-cost">Rp 0</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-title">Kebutuhan BBM</span>
                    <span class="stat-sub" id="total-liters">0 Liter</span>
                </div>
                <div class="stat-box">
                    <span class="stat-title">Biaya / Orang</span>
                    <span class="stat-sub" id="cost-per-person">Rp 0</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
